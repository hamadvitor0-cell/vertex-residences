    <div id="root">
      <div

          inset: 0;
          display: grid;
          place-items: center;
          background: radial-gradient(ellipse at 58% 38%, #303b3a, #192124 64%);
          color: #f3f0e9;
          text-align: center;

      >
        <div style="width: min(75%, 320px)">
          <div

              font:
                24px Georgia,
                serif;
              letter-spacing: 0.3em;

          <div style="font: 600 10px system-ui; color: #d4c7b3; letter-spacing: 0.17em">
            CARREGANDO A EXPERIÊNCIA 3D
          </div>
          <div
            style="
              font:
                58px/1 Georgia,
                serif;
              padding: 9px 0 16px;
              border-bottom: 1px solid #f3f0e940;
            "
          >
            0<small style="font-size: 24px; color: #bea078">%</small>
          </div>
        </div>
      </div>
    </div>
    <noscript
      ><style>
        .initial-scene-loading {
          display: none !important;
        }
      </style>
      VERTEX RESIDENCES. Projeto conceitual por Viham Dev: torre única com 22 pavimentos,
